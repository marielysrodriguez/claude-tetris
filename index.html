<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="track"><span class="thumb"></span></span>
    <span id="theme-label">Oscuro</span>
  </button>

  <h1 class="title" aria-label="TETRIS">
    <span style="color: #ba68c8">T</span><span style="color: #ffd54f">E</span><span style="color: #4dd0e1">T</span><span style="color: #e57373">R</span><span style="color: #81c784">I</span><span style="color: #ffb74d">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span id="powerup-status">—</span>
          <ul class="powerup-legend">
            <li title="Bomba: destruye un área 3×3">💣 3×3</li>
            <li title="Rayo: limpia fila o columna (↑ cambia la orientación)">⚡ Fila/col</li>
            <li title="Tinte: los bloques de un color se vuelven comodines">🎨 Comodín</li>
            <li title="Gravedad: compacta los huecos del tablero">🌍 Gravedad</li>
            <li title="Congelar: la caída se pausa 5 segundos">❄️ 5 s</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
